<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shweta's Cabinet</title>
<meta name="theme-color" content="#FBF6EF" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/favicon-64.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Shweta's Cabinet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="app">
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">S</span>
      <h1>Shweta's Cabinet</h1>
    </div>
    <p class="tagline">Keep it here. Find it anytime.</p>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
      <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="search-input" type="search" placeholder="Search your files..." autocomplete="off" />
  </div>

  <main id="content">
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-illustration">
        <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.4c.4 0 .8.2 1.1.5l1.3 1.5H19.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <p>Nothing here yet.</p>
      <p class="empty-sub">Tap the + button below to add your first file.</p>
    </div>

    <div id="file-grid" class="file-grid"></div>
  </main>

  <div id="ios-install-tip" class="install-tip hidden">
    <span>Add this to your Home Screen: tap <strong>Share</strong> → <strong>Add to Home Screen</strong>.</span>
    <button id="ios-tip-close" aria-label="Dismiss">&times;</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <button id="upload-fab" class="upload-fab" aria-label="Add file">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </button>
  <input id="file-input" type="file" multiple hidden />
</div>

<script src="/app.js"></script>
</body>
</html>
